<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求职手账 · 每一步，都算数</title><meta name="description" content="用岗位卡片整理求职进度，点开记录 JD 和每一次面试。"><style>
:root{--bg:#f6f5ef;--ink:#263e38;--muted:#828b81;--line:#e3e6dc;--green:#537b67;--pink:#bd7776;--gold:#b69b51}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #b7cdb8;outline-offset:3px}header{border-bottom:1px solid var(--line);background:#fafbf7}.top{max-width:1260px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:20px 32px}.brand{font-family:Georgia,serif;font-size:20px;display:flex;align-items:center;gap:12px}.mark{background:var(--ink);color:#faf9ef;width:32px;height:32px;display:grid;place-items:center;border-radius:9px}.top small{color:var(--muted)}main{max-width:1260px;margin:auto;padding:40px 32px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:3px;font-weight:650}h1{font-family:Georgia,"Songti SC",serif;font-size:36px;font-weight:500;letter-spacing:1px;margin:9px 0}p{margin:0}.intro{display:flex;justify-content:space-between;align-items:center}.sub{color:var(--muted);font-size:13px}.primary{background:var(--ink);color:white;border:0;border-radius:8px;padding:11px 20px}.primary:hover{background:#3e6256}.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:30px 0 28px;border:1px solid var(--line);background:#fcfcf8;border-radius:12px;padding:18px 0}.stat{padding:0 24px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat span{font-size:12px;color:var(--muted)}.stat strong{font:30px Georgia,serif;margin-right:10px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tab,.quiet{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:7px;padding:7px 12px}.tab.active{background:#e5ebdf;color:var(--ink)}.search{border:1px solid var(--line);border-radius:7px;background:#fcfcf8;padding:9px 12px;width:220px;color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{position:relative;border:1px solid #e6e7df;border-radius:11px;background:#fff;min-height:234px;overflow:hidden;box-shadow:0 3px 8px #334b3303;transition:transform .15s,box-shadow .15s;text-align:left;color:inherit;padding:23px;width:100%;display:flex;flex-direction:column}.card:hover{transform:translateY(-3px);box-shadow:0 9px 24px #334b3310}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}.cardtop{display:flex;justify-content:space-between;align-items:start;gap:8px}.company{font-family:Georgia,"Songti SC",serif;font-size:21px;font-weight:600}.badge{font-size:11px;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,white);border-radius:5px;padding:3px 8px;white-space:nowrap}.role{font-size:12px;color:#737e75;margin:5px 0 20px}.timeline{display:flex;margin:0 0 20px;justify-content:space-between}.step{position:relative;width:25%;font-size:10px;color:#a6aea7;padding-top:20px}.step:before{content:"";position:absolute;top:4px;left:5px;right:-5px;height:1px;background:#e5e8e2}.step:last-child:before{display:none}.dot{position:absolute;left:0;top:0;width:10px;height:10px;border:1px solid #d8dfd6;background:white;border-radius:50%;z-index:1}.done .dot{background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--accent)}.done{color:#526757}.step time{display:block;font-size:9px;color:#929b93}.cardfoot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #f0f1eb;padding-top:12px;font-size:11px;color:#929b93}.next{color:var(--green);max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hint{font-size:11px;color:#919b91;margin:28px 0 0;display:flex;justify-content:space-between;gap:12px}.empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}dialog{position:fixed;left:auto;right:0;top:0;margin:0;height:100dvh;max-height:100dvh;width:540px;max-width:100%;border:0;background:#fbfcf8;color:var(--ink);padding:0;box-shadow:-12px 0 60px #213b3820}dialog::backdrop{background:#1b302f50;backdrop-filter:blur(2px)}.drawerhead{padding:25px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.drawerhead h2{margin:0;font:25px Georgia,"Songti SC",serif}.close{border:0;background:#edf0e8;border-radius:50%;width:30px;height:30px;color:var(--ink);font-size:20px}form{padding:24px 28px 30px}.label{display:block;font-size:12px;color:#66796b;margin-bottom:6px}form input,form select,textarea{width:100%;border:1px solid #dfe4d9;border-radius:7px;background:white;color:var(--ink);padding:10px 12px;outline:none}form input:focus,textarea:focus{border-color:var(--green)}.field{margin-bottom:17px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.sectiontitle{font-size:14px;font-weight:650;margin:24px 0 13px;border-top:1px solid var(--line);padding-top:20px}textarea{resize:vertical;min-height:180px;line-height:1.8}.notes{min-height:85px}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:24px}.danger{background:transparent;border:0;color:#b07876;padding:8px}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:10px 22px;border-radius:8px;z-index:10;font-size:13px;display:none}.tools{display:flex;gap:8px}.tools button{font-size:11px;border:0;background:none;color:#71806f;padding:0}.demo{font-size:11px;background:#eceee4;padding:4px 9px;border-radius:5px;color:#7b876d}.note{font-size:11px;color:var(--muted);margin-top:7px}@media(min-width:1450px){main{padding-top:55px}}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){main{padding:26px 18px}.top{padding:16px 18px}.top small{display:none}h1{font-size:29px}.intro{align-items:start;gap:12px}.primary{padding:10px 13px}.grid{grid-template-columns:1fr}.stats{margin-top:24px}.stat{padding:0 12px}.stat strong{font-size:25px;display:block}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.hint{flex-direction:column}.card{min-height:220px}}
</style></head><body><header><div class="top"><div class="brand"><span class="mark">↗</span> 求职手账 <span class="demo">可编辑示例</span></div><small>CAREER JOURNAL / 把机会，慢慢变成答案</small></div></header><main><div class="intro"><div><div class="eyebrow">MY NEXT CHAPTER</div><h1>每一步，都算数。</h1><p class="sub">收藏心动的岗位，记录每一次向前。点击卡片，展开你的岗位档案。</p></div><button class="primary" id="add">＋ 新增岗位</button></div><div class="stats" id="stats"></div><div class="toolbar"><div class="tabs" id="tabs"></div><input class="search" id="search" placeholder="⌕  搜索公司、岗位或城市" aria-label="搜索岗位"></div><div class="grid" id="grid"></div><div class="hint"><span>● 数据仅保存在当前浏览器 · 换设备前请导出备份</span><div class="tools"><button id="export">↓ 导出备份</button><button id="import">↑ 导入备份</button><input type="file" id="file" accept="application/json" hidden></div></div></main>
<dialog id="drawer" aria-labelledby="drawerTitle"><div class="drawerhead"><div><div class="eyebrow">POSITION NOTES</div><h2 id="drawerTitle">岗位档案</h2></div><button class="close" id="close" aria-label="关闭">×</button></div><form id="form"><div class="two"><div class="field"><label class="label" for="company">公司 *</label><input id="company" required maxlength="100"></div><div class="field"><label class="label" for="role">岗位名称 *</label><input id="role" required maxlength="150"></div></div><div class="two"><div class="field"><label class="label" for="city">城市</label><input id="city" placeholder="上海 / 北京"></div><div class="field"><label class="label" for="type">岗位类型</label><select id="type"><option>校招</option><option>社招</option><option>实习</option><option>其他</option></select></div></div><div class="two"><div class="field"><label class="label" for="status">当前进度</label><select id="status"></select></div><div class="field"><label class="label" for="applied">投递日期</label><input id="applied" type="date"></div></div><div class="two"><div class="field"><label class="label" for="next">下一步安排</label><input id="next" placeholder="例如：准备一面 / 等待反馈"></div><div class="field"><label class="label" for="nextDate">安排日期</label><input id="nextDate" type="date"></div></div><div class="sectiontitle">JD · 留住岗位的原始信息</div><div class="field"><label class="label" for="url">招聘链接</label><input id="url" type="url" placeholder="https://…"><p class="note" id="joblink"></p></div><div class="field"><label class="label" for="jd">岗位描述</label><textarea id="jd" placeholder="粘贴完整 JD：工作职责、任职要求、加分项……"></textarea></div><div class="sectiontitle">流程记录</div><p class="note">填写实际完成日期，卡片上会同步展示。</p><div id="dates" class="two"></div><div class="field"><label class="label" for="notes">备注 / 面试复盘</label><textarea class="notes" id="notes" placeholder="记录岗位匹配点、沟通信息、面试问题和待办事项。"></textarea></div><div id="deleteConfirm" hidden style="margin-top:20px;padding:16px;border:1px solid #e7ceca;border-radius:8px;background:#fff4f1" role="group" aria-label="确认删除岗位"><p>确定删除这个岗位及其 JD 记录？</p><div style="display:flex;gap:10px;margin-top:12px"><button type="button" class="primary" id="confirmDelete" style="background:#a75d59">确认删除</button><button type="button" class="quiet" id="cancelDelete">取消</button></div></div><div class="actions"><button class="danger" type="button" id="delete">删除岗位</button><button class="primary" type="submit">保存岗位档案</button></div></form></dialog><div class="toast" id="toast" role="status"></div>
<script>
const KEY='career-journal-v1', statuses=['待投递','已投递','笔试','一面','二面','终面','Offer','已结束'], stages=['投递','笔试','一面','二面','终面','Offer'];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const samples=[{company:'好未来',role:'AI 产品经理（硬件）',city:'北京',status:'二面',applied:'2026-09-15',next:'准备二面 · 产品方案复盘',nextDate:'2026-10-22',dates:['2026-09-15','','2026-09-18','2026-10-14'],jd:'【示例 JD，请替换为真实岗位信息】\n工作职责\n1. 参与 AI 产品需求分析与功能规划。\n2. 设计用户流程，推动方案落地与迭代。\n\n任职要求\n理解大模型应用，具备需求拆解及数据分析能力。'},{company:'快手',role:'数据产品经理',city:'北京',status:'一面',applied:'2026-09-18',next:'整理项目案例',dates:['2026-09-18','2026-09-29','2026-10-10']},{company:'美团',role:'AI 产品经理',city:'北京 / 上海',status:'笔试',applied:'2026-10-13',next:'完成产品设计笔试',dates:['2026-10-13','2026-10-14']},{company:'腾讯',role:'AI 产品经理',city:'深圳',status:'已投递',applied:'2026-10-13',next:'等待简历反馈',dates:['2026-10-13']},{company:'心动的下一站',role:'Agent 产品经理',city:'上海',status:'待投递',next:'补充 JD，评估岗位匹配度',dates:[]},{company:'字节跳动',role:'AI 产品 · 平台方向',city:'北京',status:'已结束',applied:'2026-09-18',next:'记录复盘，继续出发',dates:['2026-09-18','','2026-09-24']}].map((x,i)=>({id:crypto.randomUUID(),type:'校招',notes:'',jd:'',url:'',nextDate:'',...x}));
let jobs;try{const raw=localStorage.getItem(KEY);jobs=raw?JSON.parse(raw):samples;if(!Array.isArray(jobs))throw Error();}catch{jobs=samples}let filter='全部',query='',editing=null;const filters=['全部','待投递','进行中','Offer','已结束'];
function color(s){return s==='已结束'?'#bd7776':s==='Offer'?'#5d886b':['一面','二面','终面'].includes(s)?'#b69b51':s==='笔试'?'#75a69b':'#91a7bf'}function ongoing(j){return !['待投递','已结束','Offer'].includes(j.status)}
function render(){ $('stats').innerHTML=[[jobs.length,'全部岗位'],[jobs.filter(ongoing).length,'正在进行'],[jobs.filter(j=>['一面','二面','终面'].includes(j.status)).length,'面试阶段'],[jobs.filter(j=>j.status==='Offer').length,'收获 Offer']].map(([n,t])=>`<div class="stat"><strong>${n.toString().padStart(2,'0')}</strong><span>${t}</span></div>`).join('');$('tabs').innerHTML=filters.map(f=>`<button class="tab ${filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('');const shown=jobs.filter(j=>(filter==='全部'||filter==='进行中'&&ongoing(j)||j.status===filter)&&`${j.company} ${j.role} ${j.city}`.toLowerCase().includes(query));$('grid').innerHTML=shown.length?shown.map(j=>{let level=stages.indexOf(j.status==='已投递'?'投递':j.status);let visible=[0,1,2,3];if(level>3)visible=[0,2,4,5];if(j.status==='已结束'){const filled=(j.dates||[]).map((v,i)=>v?i:-1);level=Math.max(-1,...filled)}return `<button class="card" data-id="${esc(j.id)}" style="--accent:${color(j.status)}"><div class="cardtop"><span class="company">${esc(j.company)}</span><span class="badge">${esc(j.status)}</span></div><div class="role">${esc(j.role)} · ${esc(j.city||'城市待定')} · ${esc(j.type||'其他')}</div><div class="timeline">${visible.map(i=>`<span class="step ${i<=level?'done':''}"><i class="dot"></i>${stages[i]}<time>${esc((j.dates?.[i]|| (i===0?j.applied:'')||'').slice(5).replace('-','.'))||'—'}</time></span>`).join('')}</div><div class="cardfoot"><span class="next">${esc(j.nextDate?j.nextDate.slice(5).replace('-','.')+' · ':'')}${esc(j.next||'添加下一步安排')}</span><span>${j.jd?'JD 已记录':'＋ 记录 JD'} ↗</span></div></button>`}).join(''):'<div class="empty">这里暂时没有岗位。新增一个机会，或试试其他筛选。</div>'}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}function persist(){try{localStorage.setItem(KEY,JSON.stringify(jobs));return true}catch{toast('保存失败，浏览器存储空间不足或被禁用，请先导出备份');return false}}
$('status').innerHTML=statuses.map(s=>`<option>${s}</option>`).join('');$('dates').innerHTML=stages.map((s,i)=>`<div class="field"><label class="label" for="date${i}">${s}日期</label><input type="date" id="date${i}"></div>`).join('');const fields=['company','role','city','type','status','applied','next','nextDate','url','jd','notes'];function open(id){editing=id;$('deleteConfirm').hidden=true;const j=jobs.find(x=>x.id===id)||{type:'校招',status:'待投递'};fields.forEach(f=>$(f).value=j[f]||'');stages.forEach((s,i)=>$('date'+i).value=j.dates?.[i]|| (i===0?j.applied:'')||'');$('drawerTitle').textContent=id?'岗位档案':'新的机会';$('delete').hidden=!id;$('joblink').innerHTML=/^https?:\/\//i.test(j.url||'')?`<a href="${esc(j.url)}" target="_blank" rel="noopener noreferrer">打开招聘页面 ↗</a>`:'';$('drawer').showModal();$('company').focus()}
$('add').onclick=()=>open(null);$('close').onclick=()=>$('drawer').close();$('drawer').addEventListener('click',e=>{if(e.target===$('drawer')&&e.clientX<$('drawer').getBoundingClientRect().left)$('drawer').close()});$('grid').onclick=e=>{const b=e.target.closest('[data-id]');if(b)open(b.dataset.id)};$('tabs').onclick=e=>{if(e.target.dataset.filter){filter=e.target.dataset.filter;render()}};$('search').oninput=e=>{query=e.target.value.toLowerCase();render()};$('form').onsubmit=e=>{e.preventDefault();const j={id:editing||crypto.randomUUID()};fields.forEach(f=>j[f]=$(f).value.trim());if(!j.company||!j.role){toast('请填写公司和岗位名称');return}j.dates=stages.map((s,i)=>$('date'+i).value);if(j.applied)j.dates[0]=j.applied;else j.applied=j.dates[0];let old=jobs;jobs=editing?jobs.map(x=>x.id===editing?j:x):[j,...jobs];if(!persist()){jobs=old;return}render();$('drawer').close();toast('岗位档案已保存')};$('delete').onclick=()=>{if(!editing)return;$('deleteConfirm').hidden=false;$('confirmDelete').focus()};$('cancelDelete').onclick=()=>{$('deleteConfirm').hidden=true;$('delete').focus()};$('confirmDelete').onclick=()=>{if(!editing)return;const old=jobs;jobs=jobs.filter(j=>j.id!==editing);if(!persist()){jobs=old;return}editing=null;$('deleteConfirm').hidden=true;render();$('drawer').close();toast('岗位已删除')};
$('export').onclick=()=>{const b=new Blob([JSON.stringify({version:1,jobs},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='career-journal-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>5e6)throw Error();const data=JSON.parse(await f.text()),arr=Array.isArray(data)?data:data.jobs;if(!Array.isArray(arr)||!arr.every(j=>j&&typeof j.company==='string'&&typeof j.role==='string'&&statuses.includes(j.status)&&(!j.dates||Array.isArray(j.dates))&&fields.every(k=>j[k]===undefined||typeof j[k]==='string')))throw Error();if(!confirm('导入将替换当前岗位。建议先导出备份，确定继续？'))return;const old=jobs;jobs=arr.map(j=>({...j,id:crypto.randomUUID()}));if(!persist()){jobs=old;return}render();toast('备份已导入')}catch{toast('导入失败，请选择有效的手账 JSON 备份')}finally{e.target.value=''}};render();
</script></body></html>
